[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name. The Python import name stays `promptcost`
# (see `from promptcost import ...`); they don't have to match.
name = "promptcostimator"
version = "0.2.0"
description = "A-priori cost estimation for LLM workloads across every provider LiteLLM supports."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Harsha Vardhan Nemani", email = "nhvardhan2020@gmail.com" }]
license = { text = "MIT" }
keywords = ["llm", "cost", "estimation", "openai", "anthropic", "gemini", "litellm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
    "litellm>=1.50",
]

[project.urls]
Homepage = "https://github.com/harsha20032020/promptcost"
Repository = "https://github.com/harsha20032020/promptcost"
Issues = "https://github.com/harsha20032020/promptcost/issues"

[project.scripts]
promptcost = "promptcost.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["promptcost*"]
